<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video Generate V2.2</title><style>body{font-family:system-ui;max-width:900px;margin:40px auto;background:#111;color:#eee;padding:20px}textarea,input,select,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;background:#181818;color:#eee;border:1px solid #444;border-radius:8px}.stage{padding:7px;border-bottom:1px solid #333}.done{color:#7ee787}.failed{color:#ff7b72}</style><h1>Video Generate V2.2</h1><p>只输入脚本，系统自动完成 12 个阶段。项目状态可断点续跑。</p><textarea id="script" rows="12" placeholder="输入完整故事脚本"></textarea><select id="ratio"><option>16:9</option><option>9:16</option><option>1:1</option></select><select id="size"><option>1080P</option><option>720P</option><option>2K</option></select><button onclick="start()">开始生成</button><input id="pid" placeholder="项目 ID"><button onclick="resume()">继续生成</button><div id="status"></div><div id="stages"></div><script>const names=["初始化","场景配置","图片分析","故事生成","角色参考图","脚本编写","尾帧提示词","尾帧生成","视频生成","音频生成","字幕生成","视频拼接"];let timer;async function start(){let r=await fetch("/api/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({script:script.value,aspect_ratio:ratio.value,size:size.value})});let x=await r.json();pid.value=x.project_id;resume()}async function resume(){if(!pid.value)return;await fetch("/api/projects/"+pid.value+"/run",{method:"POST"});clearInterval(timer);timer=setInterval(poll,1200);poll()}async function poll(){let s=await fetch("/api/projects/"+pid.value).then(r=>r.json());status.textContent="项目 "+pid.value+" · "+s.status+" · "+(s.error||"");stages.innerHTML=names.map(n=>{let v=s.stages[n]?.status||"pending";return "<div class='stage "+v+"'>"+n+"　"+v+"</div>"}).join("");if(s.status==="done"){clearInterval(timer);stages.innerHTML+="<p><a href='/api/projects/"+pid.value+"/download'>下载最终视频</a></p>"}}</script>
