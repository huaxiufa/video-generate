<!doctype html><html lang='zh-CN'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Agnes Story Video</title><style>body{font-family:system-ui;max-width:1000px;margin:40px auto}textarea{width:100%;height:320px}button{padding:12px 30px}.stage{padding:7px}</style><h1>Agnes Story Video</h1><p>只输入剧本，自动生成完整视频，并支持断点续传。</p><textarea id='script' placeholder='粘贴剧本'></textarea><p><button onclick='start()'>开始生成</button></p><div id='stages'></div><script>var names=['初始化','场景配置','图片分析','故事生成','角色参考图','脚本编写','尾帧提示词','尾帧生成','视频生成','音频生成','字幕生成','视频拼接'];function draw(s){document.getElementById('stages').innerHTML=names.map(function(n,i){return '<div class=stage>'+(i<s.current_stage?'✓ ':i===s.current_stage?'● ':'○ ')+n+'</div>'}).join('')}async function start(){var r=await fetch('/api/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({script:document.getElementById('script').value})});var p=await r.json();draw(p);await fetch('/api/projects/'+p.project_id+'/run',{method:'POST'});setInterval(async function(){var s=await (await fetch('/api/projects/'+p.project_id)).json();draw(s)},1500)}</script>
