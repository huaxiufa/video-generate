services:
  agnes-video-generator:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      # 容器内通过 Compose 服务名访问 CosyVoice 3
      COSYVOICE_BASE_URL: http://cosyvoice3:8080
    depends_on:
      - cosyvoice3
    volumes:
      - ./output:/app/output
      - ./audio:/app/audio
      - ./cache:/app/cache

  cosyvoice3:
    image: ghcr.io/hsiang-han/cosyvoice3-api:latest
    container_name: cosyvoice3
    restart: unless-stopped
    shm_size: "2gb"
    ports:
      - "8080:8080"
    environment:
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      FP16: ${COSYVOICE_FP16:-true}
      MODEL_DIR: ${COSYVOICE_MODEL_DIR:-FunAudioLLM/Fun-CosyVoice3-0.5B-2512}
    volumes:
      # 持久化 Hugging Face / CosyVoice 模型，避免每次重建重新下载约 10GB
      - ./cache/cosyvoice-models:/root/.cache/models
      # CosyVoice 注册的角色声音持久化
      - ./audio/voices:/app/voices
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
